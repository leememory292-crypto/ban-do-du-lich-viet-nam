html,body{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;}
#wrap{display:flex;height:100vh;}
#panel{width:330px;min-width:330px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;z-index:1000;}
#panel h2{margin:0;padding:12px 14px;background:#1F6F3B;color:#fff;font-size:16px;}
#panel .sub{padding:8px 14px;font-size:12px;color:#555;border-bottom:1px solid #eee;}
#search{margin:10px 14px 4px;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
#filters{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;}
#filters button{flex:1;padding:7px 4px;border:1px solid #1F6F3B;background:#fff;color:#1F6F3B;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;}
#filters button.active{background:#1F6F3B;color:#fff;}
#list{flex:1;overflow-y:auto;padding:0 0 10px;}
.item{padding:9px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;}
.item:hover{background:#f4f9f5;}
.item .t{font-weight:bold;font-size:14px;}
.item .a{font-size:12px;color:#666;margin-top:2px;}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;margin-right:6px;}
.badge.nh{background:#e67e22;} .badge.ks{background:#2980b9;} .badge.dl{background:#27ae60;} .badge.cf{background:#8e5a2b;} .badge.xx{background:#7f8c8d;}
#map{flex:1;height:100vh;}
.poi-icon{font-size:22px;text-align:center;line-height:30px;width:30px;height:30px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4);}
.leaflet-popup-content{font-size:13px;line-height:1.5;min-width:230px;}
.leaflet-popup-content h3{margin:0 0 6px;font-size:15px;}
.btns{margin-top:8px;}
.btns a{display:inline-block;margin:3px 6px 0 0;padding:7px 12px;border-radius:6px;text-decoration:none;font-size:13px;color:#fff;}
.btns a.gm{background:#1a73e8;} .btns a.dir{background:#1F6F3B;} .btns a.tel{background:#e67e22;}
@media (max-width:760px){
  #wrap{flex-direction:column;}
  #panel{width:100%;min-width:0;max-height:42vh;border-right:none;border-bottom:1px solid #ddd;}
  #map{height:58vh;}
}

      <button data-f="Nhà hàng">🍽️ Ăn</button>
      <button data-f="Cà phê">☕ Cafe</button>
      <button data-f="Khách sạn">🏨 Ở</button>
      <button data-f="Gọi xe">🚕 Gọi xe</button>
      <button data-f="Điểm du lịch">🏞️ Chơi</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

function iconFor(loai){
  var e = ICONS[loai] || "\uD83D\uDCCD";
  return L.divIcon({className:"", html:'<div class="poi-icon">'+e+'</div>', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-14]});
}
function badgeCls(loai){
  return BADGES[loai] || "xx";
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function popupHtml(d){
  var h = '<h3>'+esc(d.ten)+'</h3>';
  h += '<div><span class="badge '+badgeCls(d.loai)+'">'+esc(d.loai)+'</span></div>';
  h += '<div>\uD83D\uDCCD '+esc(d.dia_chi)+'</div>';
  if(d.gio) h += '<div>\uD83D\uDD50 '+esc(d.gio)+'</div>';
  if(d.dienthoai) h += '<div>\uD83D\uDCDE <a href="tel:'+esc(d.dienthoai.replace(/[ .]/g,""))+'">'+esc(d.dienthoai)+'</a></div>';
  if(d.gia) h += '<div>\uD83D\uDCB0 '+esc(d.gia)+'</div>';
  if(d.mota) h += '<div style="margin-top:4px;color:#444;">'+esc(d.mota)+'</div>';
  h += '<div class="btns">';
  h += '<a class="gm" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+d.lat+','+d.lon+'">M\u1edf tr\u00ean Google Maps</a>';
  h += '<a class="dir" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+d.lat+','+d.lon+'">D\u1eabn \u0111\u01b0\u1eddng t\u1edbi \u0111\u00e2y</a>';
  if(d.dienthoai) h += '<a class="tel" href="tel:'+esc(d.dienthoai.replace(/[ .]/g,""))+'">G\u1ecdi \u0111i\u1ec7n</a>';
  h += '</div>';
  return h;
}
var markers = [];
var listEl = document.getElementById("list");
var curFilter = "all";
function render(){
  listEl.innerHTML = "";
  markers.forEach(function(m){ map.removeLayer(m); });
  markers = [];
  var q = document.getElementById("search").value.toLowerCase();
  var shown = 0;
  DATA.forEach(function(d, i){
    if(curFilter !== "all" && d.loai !== curFilter) return;
    if(q && (d.ten+" "+d.dia_chi+" "+d.mota).toLowerCase().indexOf(q) < 0) return;
    shown++;
    var mk = L.marker([d.lat, d.lon], {icon: iconFor(d.loai)}).addTo(map);
    mk.bindPopup(popupHtml(d));
    markers.push(mk);
    var div = document.createElement("div");
    div.className = "item";
    div.innerHTML = '<div><span class="badge '+badgeCls(d.loai)+'">'+esc(d.loai)+'</span><span class="t">'+esc(d.ten)+'</span></div><div class="a">'+esc(d.dia_chi)+'</div>';

    listEl.appendChild(div);
  });
  document.getElementById("count").textContent = "Hi\u1ec3n th\u1ecb "+shown+"/"+DATA.length+" \u0111\u1ecba \u0111i\u1ec3m";
}
document.getElementById("search").addEventListener("input", render);

    render();
  });
});
